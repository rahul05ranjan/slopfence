- id: slopfence
  name: slopfence
  description: Find the junk AI coding assistants leave behind.
  entry: slopfence
  language: python
  types_or: [python, toml, text]
  # Every file slopfence reads: Python files and the files that declare dependencies.
  # A few more match (my-requirements-notes.txt); slopfence leaves those alone.
  files: '(\.py|(^|/)(pyproject\.toml|setup\.cfg|Pipfile)|(requirements|constraints)[^/]*\.(txt|in)|(^|/)requirements/.*\.(txt|in))$'
  require_serial: true

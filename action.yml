name: slopfence
description: Find the junk AI coding assistants leave behind (hallucinated packages, fake tests, placeholders, chat leftovers).
author: syedmuhdahmad
branding:
  icon: check-circle
  color: orange

inputs:
  paths:
    description: Files or directories to check (space-separated).
    default: "."
  diff:
    description: >
      Which lines to check. "auto" (default) checks only lines changed versus the
      pull request base branch on pull_request events, and everything otherwise.
      "none" always checks everything. Any other value is a git ref to diff against.
    default: "auto"
  args:
    description: Extra arguments passed to slopfence (e.g. "--ignore SLOP051").
    default: ""
  sarif-file:
    description: If set, also write a SARIF report to this path (for github/codeql-action/upload-sarif).
    default: ""
  version:
    description: slopfence version to install. Defaults to the version matching this action ref.
    default: ""

runs:
  using: composite
  steps:
    - name: Install slopfence
      id: install
      shell: bash
      env:
        SLOPFENCE_VERSION: ${{ inputs.version }}
      run: |
        # Use a private virtualenv: system Pythons on recent runners reject
        # `pip install` (PEP 668), and Windows usually has no `python3`.
        # Every Python here runs with -I. The steps run in the repository that is
        # checked, and without -I Python looks for modules in that folder first: a
        # file there named like a standard module would be imported and run.
        # pip starts Pythons of its own without -I, so this step also leaves the
        # repository and drops a PYTHONPATH that may point into it.
        cd "$RUNNER_TEMP"
        unset PYTHONPATH
        py=""
        for candidate in python3 python; do
          if command -v "$candidate" >/dev/null 2>&1 \
            && "$candidate" -I -c "import sys; sys.exit(sys.version_info < (3, 10))" >/dev/null 2>&1; then
            py="$candidate"
            break
          fi
        done
        if [ -z "$py" ]; then
          echo "::error::slopfence needs Python 3.10+ on the runner (add actions/setup-python first)"
          exit 1
        fi
        venv="$RUNNER_TEMP/slopfence-venv"
        "$py" -I -m venv "$venv"
        if [ -x "$venv/bin/python" ]; then bin="$venv/bin"; else bin="$venv/Scripts"; fi
        if [ -n "$SLOPFENCE_VERSION" ]; then
          "$bin/python" -I -m pip install --quiet --disable-pip-version-check "slopfence==$SLOPFENCE_VERSION"
        else
          "$bin/python" -I -m pip install --quiet --disable-pip-version-check "$GITHUB_ACTION_PATH"
        fi
        echo "python=$bin/python" >> "$GITHUB_OUTPUT"

    - name: Run slopfence
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_DIFF: ${{ inputs.diff }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_SARIF: ${{ inputs.sarif-file }}
        BASE_REF: ${{ github.base_ref }}
        PY: ${{ steps.install.outputs.python }}
      run: |
        case "$INPUT_DIFF" in
          auto)
            diff_ref=""
            if [ -n "$BASE_REF" ]; then
              git fetch --quiet --no-tags origin "$BASE_REF"
              diff_ref="origin/$BASE_REF"
            fi
            ;;
          none|"") diff_ref="" ;;
          *) diff_ref="$INPUT_DIFF" ;;
        esac
        diff_args=()
        if [ -n "$diff_ref" ]; then diff_args=(--diff "$diff_ref"); fi
        # shellcheck disable=SC2086
        if [ -n "$INPUT_SARIF" ]; then
          "$PY" -I -m slopfence $INPUT_PATHS "${diff_args[@]}" $INPUT_ARGS \
            --format sarif --output "$INPUT_SARIF" --exit-zero
        fi
        # shellcheck disable=SC2086
        "$PY" -I -m slopfence $INPUT_PATHS "${diff_args[@]}" $INPUT_ARGS

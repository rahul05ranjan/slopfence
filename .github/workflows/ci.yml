name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: slopfence checks itself
        run: slopfence src tests
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - name: Run tests with coverage
        run: coverage run -m pytest -q
      # Each job measures its own Python version and OS; the coverage job combines them.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.os }}-${{ matrix.python-version }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  # Combined line and branch coverage of every test job: a table in the run summary,
  # coverage.xml and an HTML report as artifacts, and a minimum (fail_under in
  # pyproject.toml) so coverage can't silently drop.
  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install 'coverage[toml]>=7.16'
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - name: Combine and report
        run: |
          coverage combine
          coverage xml
          coverage html --skip-covered
          coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
      - name: Coverage must stay above the minimum
        run: coverage report

  # Builds the sdist and wheel exactly like release.yml, so packaging breaks on the
  # pull request instead of at release time.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke-test the wheel (same as the release workflow)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/slopfence --version
          /tmp/smoke/bin/slopfence src --offline
      - name: The sdist contains only what's needed to build and test
        run: |
          sdist=$(ls dist/*.tar.gz)
          size=$(stat -c %s "$sdist")
          echo "sdist: $sdist ($size bytes)"
          tar tzf "$sdist" | sed 's|^[^/]*/||' | sort > contents.txt
          cat contents.txt
          if grep -E '^(docs|\.github)/' contents.txt; then
            echo "::error::the sdist contains docs/ or .github/ files"; exit 1
          fi
          # The limit keeps a demo GIF, a logo or a fixture folder from slipping in. It
          # was 100 KB until v0.3. Tests ship in the sdist, because people who package
          # slopfence run them, and the README is in it twice (as README.md and inside
          # PKG-INFO). So it grows with every feature: v0.3 adds about 100 KB, most of
          # it tests. The check above is the real guard against shipping assets.
          [ "$size" -lt 300000 ] || { echo "::error::the sdist is larger than 300 KB"; exit 1; }
      - name: Build a wheel from the sdist and run its tests
        run: |
          mkdir /tmp/from-sdist && tar xzf dist/*.tar.gz -C /tmp/from-sdist
          src=$(echo /tmp/from-sdist/*)
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install build pytest
          /tmp/sdist-venv/bin/python -m build --wheel "$src" -o /tmp/sdist-wheel
          /tmp/sdist-venv/bin/pip install /tmp/sdist-wheel/*.whl
          cd "$src" && /tmp/sdist-venv/bin/python -m pytest -q -p no:cacheprovider

  # End-to-end tests of the GitHub Action and the pre-commit hook (reusable workflows).
  action:
    uses: ./.github/workflows/action.yml
    permissions:
      contents: read
      security-events: write  # its sarif-upload job uploads to code scanning

  pre-commit:
    uses: ./.github/workflows/pre-commit-hook.yml

  # Single required status check that gates merging into main. It fails if any job
  # above fails or is cancelled. Skipped jobs don't fail it: sarif-upload is skipped
  # for pull requests from forks, whose token can't write security events.
  ci:
    if: always()
    needs: [lint, test, coverage, package, action, pre-commit]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: echo "All checks passed"
      - name: Some checks failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
